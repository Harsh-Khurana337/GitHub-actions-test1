name: Matrix Example
on: push
jobs:
    build:
        strategy:
          matrix:
            java-version: [21, 26]
            operating-system: [ubuntu-latest, ubuntu-slim]
            include:
              - java-version: 17
                operating-system: ubuntu-latest
            exclude:
              - java-version: 21
                operating-system: ubuntu-slim
        runs-on: ${{ matrix.operating-system }}

        steps:
        - name: Checkout Code
          uses: actions/checkout@v6

        - name: Set up Java ${{ matrix.java-version }}
          uses: actions/setup-java@v6
          with:
              java-version: ${{ matrix.java-version }}
              distribution: 'temurin'
              cache: 'maven' # Automatically caches your ~/.m2 dependencies to speed up future runs

        - name: Grant Execute Permission to Maven Wrapper
          run: chmod +x mvnw

        - name: Run Maven Test
          run: ./mvnw clean package -Djava.version=${{ matrix.java-version }}