name: Matrix Example
on: push
jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
          matrix:
            java-version: [11, 17, 26]
        steps:
        - name: Checkout Code
          uses: actions/checkout@v6

        - name: Set up Java ${{ matrix.java-version }}
          uses: actions/setup-java@v6
          with:
              java-version: ${{ matrix.java-version }}
              distribution: 'temurin'
              cache: 'maven' # Automatically caches your ~/.m2 dependencies to speed up future runs

        - name: Grant Execute Permission to Maven Wrapper
          run: chmod +x mvnw

        - name: Run Maven Test
          run: ./mvnw clean test