name: Script Injection Issues Example
on:
  issues:
    types:
      - opened
jobs:
  title-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Assign label
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          if [[ "$TITLE" == *"bug"* ]]; then
          echo "Issue is about a bug"
          else
          echo "Issue is not about a bug"
          fi