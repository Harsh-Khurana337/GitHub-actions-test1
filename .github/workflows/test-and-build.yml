## Remember you are running this application on a runner, and this will not run on your local machine and localhost won't work.
name: Java 26 Build and Test

on:
  pull_request:
    branches: [ main ]
    types: [opened, closed]

jobs:
  test:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Set up Java 26
        uses: actions/setup-java@v6
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: 'maven' # Automatically caches your ~/.m2 dependencies to speed up future runs

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Run Maven Test
        run: ./mvnw clean test

  build:
    needs: test
    runs-on: ubuntu-slim
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Java 26
        uses: actions/setup-java@v6
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: 'maven' # Automatically caches your ~/.m2 dependencies to speed up future runs

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Run Maven Test
        run: ./mvnw clean verify

      - name: start the application
        run: ./mvnw spring-boot:run &