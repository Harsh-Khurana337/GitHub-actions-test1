## Remember you are running this application on a runner, and this will not run on your local machine.
name: Java 26 Build and Test

on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: 'maven' # Automatically caches your ~/.m2 dependencies to speed up future runs

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Run Maven Build and Test
        run: ./mvnw clean test

        ## Remember you are running this application on a runner, and this will not run on your local machine.

      - name: Run application in background
        # The '&' runs the process in the background so the workflow can continue
        run: java -jar target/your-app-name.jar &

      - name: Wait for port 8080 to be ready
        # Gives the application a few seconds to start up completely
        run: sleep 20

      - name: Test local endpoint inside the runner
        # This tests the server from inside the GitHub cloud environment
        run: curl -v http://localhost:8080