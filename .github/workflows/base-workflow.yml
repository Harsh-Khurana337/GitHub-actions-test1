name: Test and build workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Set up Java 26
        uses: actions/setup-java@v6
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: 'maven' # Automatically caches your ~/.m2 dependencies to speed up future runs
      - name: cache maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Run Maven spotbugs
        run: ./mvnw clean spotbugs:check

      - name: upload spotbugs report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: spotbugs-report
          path: target/site/spotbugs.html

      - name: Run only connectivity integration test
        run: ./mvnw -Dtest=ConnectivityIntegrationTest test --batch-mode

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Set up Java 26
        uses: actions/setup-java@v6
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: 'maven' # Automatically caches your ~/.m2 dependencies to speed up future runs
      - name: Grant Execute Permission to Maven Wrapper!
        run: chmod +x mvnw

      - name: Build Maven Package
        run: ./mvnw clean package

      - name: upload artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-data
          path: target/*.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: consuming the artifact
        uses: actions/download-artifact@v7
        with:
          name: artifacts-data
          run: |
            echo "Artifact downloaded successfully."
      - name: output content of the artifact
        run: |
          ls -l target/
