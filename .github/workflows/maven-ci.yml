name: Maven Github actions workflow
on: workflow_dispatch

jobs:
    test:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Code
          uses: actions/checkout@v6
        - name: Set up Java 26
          uses: actions/setup-java@v6
          with:
            java-version: '26'
            distribution: 'temurin'
        - name: 'Maven Cache' # Automatically caches your ~/.m2 dependencies to speed up future runs
          uses: actions/cache@v5
          with:
            path: ~/.m2/repository
            key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
            restore-keys: |
                ${{ runner.os }}-maven-
        - name: Grant Execute Permission to Maven Wrapper
          run: chmod +x mvnw
        - name: Run Maven Test
          run: ./mvnw test

    build:
      needs: test
      runs-on: ubuntu-latest
      outputs:
        artifact-name: ${{ steps.artifact-name.outputs.artifacts-data }}
      steps:
        - name: Checkout Code
          uses: actions/checkout@v6
        - name: Set up Java 26
          uses: actions/setup-java@v6
          with:
            java-version: '26'
            distribution: 'temurin'
            cache: 'maven' # Automatically caches your ~/.m2 dependencies to speed up future runs
        - name: Grant Execute Permission to Maven Wrapper!
          run: chmod +x mvnw
        - name: Build Maven Package
          run: ./mvnw clean package
        - name: upload artifact
          uses: actions/upload-artifact@v6
          with:
            name: artifacts-data
            path: target/*.jar
        - name: get the name of the output file
          id: artifact-name
          run: find target/*.jar -type f -execdir echo 'artifacts-data={}' >> $GITHUB_OUTPUT \;

    deploy:
      needs: build
      runs-on: ubuntu-latest
      steps:
        - name: consuming the artifact
          uses: actions/download-artifact@v7
          with:
            name: artifacts-data
        - name: list my artifact
          run: ls -l
        - name: getting output artifact name
          run: echo "Artifact name is ${{ needs.build.outputs.artifact-name }}"