name: Maven Github actions workflow
on:
    push:
        branches:
        - main
    pull_request:
        branches:
        - main
jobs:
    test:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Code
          uses: actions/checkout@v6
        - name: Set up Java 26
          uses: actions/setup-java@v6
          with:
            java-version: '26'
            distribution: 'temurin'
            cache: 'maven' # Automatically caches your ~/.m2 dependencies to speed up future runs
        - name: Grant Execute Permission to Maven Wrapper
          run: chmod +x mvnw
        - name: Run Maven Test
          run: ./mvnw test

    build:
      needs: test
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Code
          uses: actions/checkout@v6
        - name: Set up Java 26
          uses: actions/setup-java@v6
          with:
            java-version: '26'
            distribution: 'temurin'
            cache: 'maven' # Automatically caches your ~/.m2 dependencies to speed up future runs
        - name: Grant Execute Permission to Maven Wrapper
          run: chmod +x mvnw
        - name: Build Maven Package
          run: ./mvnw clean package
        - name: upload artifact
          uses: actions/upload-artifact@v6
          with:
            name: artifacts-data
            path: target/*.jar

    deploy:
      needs: build
      runs-on: ubuntu-latest
      steps:
        - name: consuming the artifact
          uses: actions/download-artifact@v7
          with:
            name: artifacts-data
        - name: list my artifact
          run: ls -l