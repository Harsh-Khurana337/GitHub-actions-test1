name: Reusable workflow example
on:
  workflow_call:
   inputs:
    artifact-name:
      description: 'The name of the artifact to download'
      required: false
      default: dist
      type: string
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
        - name: get artifact
          uses: actions/download-artifact@v7
          with:
            name: ${{ inputs.artifact-name }}
        - name: print artifact
          run: ls