name: JS custom action
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: get code
        uses: actions/checkout@v6
      - name: Fresh Install for Custom Action
        run: |
          cd ./.github/workflows/actions/js-custom-action
          rm -rf node_modules package-lock.json
          npm cache clean --force
          npm install
      - name: Output info form the JS custom action
        uses: ./.github/workflows/actions/js-custom-action