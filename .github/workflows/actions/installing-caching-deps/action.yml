name: installing and caching dependencies
description: This action installs and caches dependencies for a Maven project.
inputs:
  java-version:
    description: 'Java version to use (e.g., 26)'
    default: '26'
    required: true
  distribution:
    description: 'Java distribution to use (e.g., temurin)'
    default: 'temurin'
    required: true
  cache:
    description: 'Whether to cache Maven dependencies (true/false)'
    required: true
    default: 'true'
runs:
  using: 'composite'
  steps:
    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.distribution }}
        cache: ${{ inputs.cache }}

    - name: Cache Maven Dependencies
      if: ${{ inputs.cache == 'true' }}
      uses: actions/cache@v5
      with:
        path: ~/.m2
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
